name: Halo Health (Symplr)
description: >-
  Halo Health, now part of symplr and marketed as symplr Clinical Communications,
  is a HIPAA-compliant clinical communication and collaboration platform for
  healthcare organizations. It provides role-based secure messaging, voice
  communication, critical alert and clinical-alarm notification, and on-call
  schedule management so care teams can coordinate around patients. The platform
  integrates with hospital EHR and clinical systems using healthcare
  interoperability standards - HL7 ADT for patient admit/discharge/transfer
  events, HL7 ORU for laboratory and radiology results, and SMTP for alerts such
  as sepsis notifications - rather than through a documented public developer
  REST API. symplr acquired Halo Health to extend its healthcare operations
  software portfolio, and the product now sits alongside symplr's broader
  workforce, compliance, and provider-data solutions.
